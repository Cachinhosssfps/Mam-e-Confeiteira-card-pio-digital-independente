<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mamãe Confeiteira | Link na Bio</title>
<link rel="icon" type="image/png" href="assets/icone.png">
<meta name="description" content="Mamãe Confeiteira — mais que um docinho, um momento de felicidade. Peça agora, WhatsApp, iFood, Instagram e TikTok.">
<style>
  :root{
    --pink: #ec5c8d;
    --pink-dark: #d43f72;
    --pink-light: #ffe3ee;
    --cream: #fdf3e6;
    --cream-dark: #f6e6d2;
    --brown: #6b4226;
    --text: #4a3428;
    --muted: #8a7768;
    --white: #fffdfa;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
    background: var(--cream);
    background-image: radial-gradient(circle, rgba(107,66,38,0.07) 1.4px, transparent 1.4px);
    background-size: 22px 22px;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }
  .page{
    width: 100%;
    max-width: 460px;
    padding: 40px 22px 50px;
    position: relative;
  }

  /* Stickers decorativos flutuando, igual ao resto do site */
  .deco{
    position: absolute;
    font-size: 28px;
    filter: drop-shadow(0 3px 6px rgba(107,66,38,0.15));
    animation: float 5s ease-in-out infinite;
    pointer-events: none;
  }
  .deco.d1{ top: 4%; left: 4%; animation-delay: 0s; font-size: 24px; }
  .deco.d2{ top: 10%; right: 6%; animation-delay: .8s; font-size: 30px; }
  .deco.d3{ top: 46%; left: 2%; animation-delay: 1.6s; font-size: 22px; }
  .deco.d4{ top: 60%; right: 3%; animation-delay: 2.2s; font-size: 26px; }
  .deco.d5{ bottom: 6%; left: 8%; animation-delay: 1.1s; font-size: 22px; }
  @keyframes float{
    0%, 100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-10px) rotate(6deg); }
  }

  /* Logo com giro 3D de verdade (perspective + rotateY), não é só CSS transform 2D */
  .logo-stage{
    width: 132px;
    height: 132px;
    margin: 0 auto 18px;
    perspective: 900px;
  }
  .logo-coin{
    width: 100%;
    height: 100%;
    position: relative;
  }
  .logo-face{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--white);
    box-shadow: 0 14px 30px rgba(212,63,114,0.28), 0 0 0 6px var(--pink-light);
  }
  .logo-face img{
    width: 72%;
    height: 72%;
    object-fit: contain;
  }
  @media (prefers-reduced-motion: reduce){
    .deco{ animation: none; }
  }

  h1{
    text-align: center;
    font-size: 1.7rem;
    color: var(--pink-dark);
    margin: 0 0 6px;
    font-weight: 800;
  }
  .tagline{
    text-align: center;
    color: var(--muted);
    font-size: 0.92rem;
    font-weight: 600;
    margin: 0 0 18px;
  }

  .socials{
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 26px;
  }
  .socials a{
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--white);
    box-shadow: 0 6px 16px rgba(107,66,38,0.14);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 1.3rem;
    transition: transform .15s ease;
    overflow: hidden;
  }
  .socials a img{ width: 60%; height: 60%; object-fit: contain; border-radius: 8px; }
  .socials a:active{ transform: scale(0.92); }

  .links{
    display: flex;
    flex-direction: column;
    gap: 13px;
  }
  .link-btn{
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--pink);
    color: white;
    text-decoration: none;
    padding: 15px 18px;
    border-radius: 18px;
    font-weight: 700;
    font-size: 0.98rem;
    box-shadow: 0 8px 20px rgba(236,92,141,0.32);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .link-btn:active{ transform: scale(0.97); }
  .link-btn.primary{
    background: linear-gradient(135deg, var(--pink-dark), var(--pink));
    font-size: 1.05rem;
    padding: 18px;
  }
  .link-btn.outline{
    background: var(--white);
    color: var(--pink-dark);
    box-shadow: 0 6px 14px rgba(107,66,38,0.1);
    border: 2px solid var(--pink-light);
  }
  .link-icon{
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    background: rgba(255,255,255,0.25);
    flex-shrink: 0;
    overflow: hidden;
  }
  .link-icon img{ width: 100%; height: 100%; object-fit: cover; }
  .link-btn.outline .link-icon{ background: var(--pink-light); }

  footer{
    text-align: center;
    margin-top: 32px;
    color: var(--muted);
    font-size: 0.76rem;
  }
  footer .heart{ color: var(--pink); }
</style>
</head>

  <div class="socials">

      <span class="link-icon"><img src="assets/icons/ifood.png" alt=""></span> Pedir pelo iFood
    </a>
    <a class="link-btn outline" href="https://www.instagram.com/mamaeconfeiteirarj" target="_blank" rel="noopener">

    </a>
    <a class="link-btn outline" href="https://www.tiktok.com/@mamaeconfeiteirarj" target="_blank" rel="noopener">
      <span class="link-icon"><img src="assets/icons/tiktok.png" alt=""></span> TikTok
    </a>
  </div>

  <footer>
    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:3px;" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Estrada da Água Branca, 2763 — Padre Miguel, Rio de Janeiro<br>
    feito com <span class="heart">♥</span> por Mamãe Confeiteira
  </footer>
</div>

</body>
